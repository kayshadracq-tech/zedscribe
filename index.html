<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZedScribe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .app {
            max-width: 600px;
            margin: auto;
            padding: 25px 18px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 8px;
        }

        header p {
            margin-top: 0;
            color: #666;
        }

        .transcript {
            background: white;
            min-height: 300px;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #ddd;
            margin-bottom: 18px;
            font-size: 20px;
            line-height: 1.6;
        }

        .placeholder {
            color: #999;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .start-btn {
            background: #222;
            color: white;
        }

        .clear-btn {
            background: #ddd;
            color: #222;
        }
    </style>
</head>

<body>

    <main class="app">

        <header>
            <h1>ZedScribe</h1>
            <p>Speech to Text</p>
        </header>

        <section class="transcript">
            <span class="placeholder">
                Your words will appear here...
            </span>
        </section>

        <button class="start-btn">
            🎙️ Start Listening
        </button>

        <button class="clear-btn">
            🧹 Clear
        </button>

    </main>

<script src="script.js"></script>

</body>
</html>
